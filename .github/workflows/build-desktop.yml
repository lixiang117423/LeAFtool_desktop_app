# Build LeAFtool desktop installers: macOS .dmg (arm64) + Windows .exe (x64)
#
# Trigger:
#   - push to main
#   - push a tag like v1.0.0  -> also attaches the installers to a GitHub Release
#   - manual run (Actions tab -> Run workflow)
#
# Download the installers from the Actions run page ("Artifacts") or from the
# Release page created by a tag push.

name: Build LeAFtool desktop installers

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: windows-latest
            platform: win
            arch: x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # R is needed here only to run the assemble script; the actual bundled
      # runtime is downloaded separately by shinyelectron (portable R 4.5.3).
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Assemble self-contained Shiny app
        shell: bash
        run: Rscript -e 'source("scripts/assemble-app.R"); assemble_app(verbose = TRUE)'

      - name: Build Electron installer
        uses: coatless-actions/shiny-to-electron@v1
        with:
          appdir: app
          app-name: LeAFtool
          app-type: r-shiny
          runtime-strategy: bundled
          platform: ${{ matrix.platform }}
          arch: ${{ matrix.arch }}
          destdir: build
          r-version: "4.5.3"
          sign: "false"
          upload-artifact: "true"
          artifact-name: LeAFtool-${{ matrix.platform }}-${{ matrix.arch }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach installers to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
